<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ایجاد تور</title>
    <link rel="stylesheet" href="create_tour.css">
</head>
<body>
    <div class="page-header">
        <div class="brand-logo">K</div>
        <h1>پنل ایجاد تور</h1>
        <p>سفرهای جدید و تورهای دونگی را از همین‌جا برای کاربران منتشر کنید</p>
    </div>
    <div class="all">
        <form class="tour" id="tour">
            <div class="tour-inner">
                <div class="tour-heading">
                    <h4>ایجاد تور</h4>
                </div>
                <div class="label">
                    <label for="file" id="label">📁 انتخاب فایل</label>
                    <input type="file" id="file" multiple >
                </div>
                <div>
                    <input type="text" placeholder="نام مکان " id="name_place">
                </div>
                <div>
                    <textarea name="" rows="1" id="expresion" placeholder="توضیحات"></textarea>
                </div>
                <div>
                    <input type="number" id="price"  placeholder="قیمت">
                </div>
                <div>
                    <button id="submit_one" >ثبت</button>
                </div>

            </div>
        </form>
        <form class="tour tour-shared" >
            <div class="tour-inner">
                <div class="tour-heading">
                    <h3>دونگی</h3>
                    <h4>ایجاد تور</h4>
                </div>
                <div class="label">
                    <label for="file_two">📁 انتخاب فایل</label>
                    <input type="file" id="file_two" multiple>
                </div>
                <div>
                    <input type="text" placeholder="نام مکان " id="name_place_two">
                </div>
                <div>
                    <textarea name="" rows="1" id="expresion_two" placeholder="توضیحات"></textarea>
                </div>
                <div>
                    <input type="number"  id="price_two" placeholder="قیمت">
                </div>
                <div>
                    <button id="submit_two">ثبت</button>
                </div>

            </div>


        </form>

    </div>
</body>
</html>
<script src="create_tour.js"></script>

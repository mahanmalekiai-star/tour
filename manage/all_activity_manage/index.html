<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>مدیر</title>
</head>
<body>
    <div class="dash">

        <header class="dash-header">
            <div class="brand">
                <div class="brand-logo">KO</div>
                <div class="brand-text">
                    <h1>KianOvin</h1>
                    <span>پنل مدیریت</span>
                </div>
            </div>
        </header>

        <div class="all">

            <section class="dash-section">
                <h2 class="section-title"><span>✈️</span> مدیریت تورها</h2>
                <div class="tours">
                    <button id="create_tour" class="card">
                        <span class="card-icon">➕</span>
                        <span class="card-title">ایجاد تور</span>
                        <p>می‌توانی سفرهای جدید که قرار است بروید را اینجا آپلود کنید، همینطور تورهای دونگی</p>
                    </button>
                    <button class="card">
                        <span class="card-icon">📋</span>
                        <span class="card-title">تورهای رزرو شده</span>
                        <p>کسانی که تور را گرفتند را می‌توان اطلاعاتشان را دید</p>
                    </button>
                </div>
            </section>

            <section class="dash-section">
                <h2 class="section-title"><span>👥</span> کاربران و ارتباطات</h2>
                <div class="users">
                    <button id="users" class="card">
                        <span class="card-icon">👱‍♂️</span>
                        <span class="card-title">کاربران</span>
                        <p>کاربرانی که در سایت شما هستند را می‌توان دید</p>
                    </button>
                    <button id="question" class="card">
                        <span class="card-icon">❓</span>
                        <span class="card-title">سوالات <h5 id="number"></h5></span>
                        <p>سوالات و مشکلاتی که کاربران براشون پیش اومده را اینجا جواب دهید</p>
                    </button>
                    <button id="new_message" class="card">
                        <span class="card-icon">❗</span>
                        <span class="card-title">خبر جدید</span>
                        <p>پیام‌هایی که قادر هستید برای کاربران بفرستید را اینجا درج کنید</p>
                    </button>
                </div>
            </section>

            <section class="dash-section">
                <h2 class="section-title"><span>⚙️</span> مدیریت محتوا</h2>
                <div class="change">
                    <button id="update" class="card">
                        <span class="card-icon">🔄</span>
                        <span class="card-title">بروزرسانی</span>
                        <p>عکس‌ها یا ویدیوهایی که می‌خواهید تغییر دهید</p>
                    </button>
                    <button id="delete" class="card">
                        <span class="card-icon">🗑️</span>
                        <span class="card-title">حذف</span>
                        <p>محتواهایی که فرستادید را می‌توان حذف کرد</p>
                    </button>
                </div>
            </section>

            <div class="box_new_meessage" id="container_new_message">

            </div>

        </div>
    </div>
   
</body>
</html>
<script src="index.js"></script>
